<svg xmlns="http://www.w3.org/2000/svg" width="1016" height="270" viewBox="0 0 1016 270" role="img" aria-label="The five families of a normalized maximizer, by the corners of the square it occupies: N, no corner, C1, one corner, C2, two opposite corners, Type II, two adjacent corners, Type III, three corners. Each square shows the points the normalization places on the sides and at the corners; the others are free.">
<title>The five families of a normalized maximizer, by the corners of the square it occupies: N, no corner, C1, one corner, C2, two opposite corners, Type II, two adjacent corners, Type III, three corners. Each square shows the points the normalization places on the sides and at the corners; the others are free.</title>
