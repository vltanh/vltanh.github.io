<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" role="img" aria-label="The optimal configuration of nine points in the unit square, found by Comellas and Yebra: A and H on the left side, B and C on the bottom, D and E on the right, F and G on the top, and O inside. Its eleven triangles of least area, H₉ = (9√65 − 55)/320 ≈ 0.0548760, are shaded, in pairs of mirror images in the anti-diagonal: ABC and DEF, ABH and EFG, AGH and FGH, ADO and CFO, CGO and DHO; BEO is its own mirror image">
