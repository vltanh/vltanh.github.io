<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" role="img" aria-label="A sheet split into ten layers that alternate between two deformations, A and C. The difference C − A has rank one: it squashes a square flat onto a segment, drawn in blue. So the layers meet along straight interfaces, also blue, without a gap, and the lines of a square grid drawn on the sheet bend into a zigzag at each interface.">
<title>A sheet split into ten layers that alternate between two deformations, A and C. The difference C − A has rank one: it squashes a square flat onto a segment, drawn in blue. So the layers meet along straight interfaces, also blue, without a gap, and the lines of a square grid drawn on the sheet bend into a zigzag at each interface.</title>
