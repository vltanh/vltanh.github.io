<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <rect width="400" height="260" fill="#0b1120"/>
  <g fill="none" stroke-linecap="round">
    <!-- C1 intra-cluster (azure) -->
    <g stroke="#78b4ff" stroke-width="1.4" opacity="0.85">
      <line x1="70" y1="80" x2="110" y2="60"/>
      <line x1="70" y1="80" x2="120" y2="105"/>
      <line x1="110" y1="60" x2="120" y2="105"/>
      <line x1="110" y1="60" x2="160" y2="75"/>
      <line x1="120" y1="105" x2="160" y2="75"/>
      <line x1="120" y1="105" x2="95" y2="135"/>
      <line x1="95" y1="135" x2="70" y2="80"/>
    </g>
    <!-- C2 intra-cluster (amber) -->
    <g stroke="#ffc66b" stroke-width="1.4" opacity="0.85">
      <line x1="260" y1="70" x2="300" y2="95"/>
      <line x1="260" y1="70" x2="320" y2="55"/>
      <line x1="300" y1="95" x2="320" y2="55"/>
      <line x1="300" y1="95" x2="280" y2="130"/>
      <line x1="280" y1="130" x2="320" y2="55"/>
    </g>
    <!-- C3 intra-cluster (mint) -->
    <g stroke="#6bffc9" stroke-width="1.4" opacity="0.85">
      <line x1="175" y1="195" x2="210" y2="210"/>
      <line x1="175" y1="195" x2="200" y2="170"/>
      <line x1="210" y1="210" x2="200" y2="170"/>
    </g>
    <!-- Inter-cluster (cobalt) -->
    <g stroke="#3a66cc" stroke-width="1.2" opacity="0.65">
      <line x1="160" y1="75" x2="260" y2="70"/>
      <line x1="120" y1="105" x2="200" y2="170"/>
      <line x1="280" y1="130" x2="210" y2="210"/>
      <line x1="320" y1="55" x2="200" y2="170"/>
    </g>
    <!-- Outlier (signal) -->
    <g stroke="#ff6b7a" stroke-width="1.2" opacity="0.7">
      <line x1="35" y1="185" x2="95" y2="135"/>
      <line x1="35" y1="185" x2="175" y2="195"/>
      <line x1="365" y1="185" x2="280" y2="130"/>
      <line x1="365" y1="185" x2="210" y2="210"/>
    </g>
  </g>
  <g>
    <!-- C1 nodes -->
    <g fill="#78b4ff">
      <circle cx="70" cy="80" r="7"/>
      <circle cx="110" cy="60" r="7"/>
      <circle cx="120" cy="105" r="7"/>
      <circle cx="160" cy="75" r="5"/>
      <circle cx="95" cy="135" r="5"/>
    </g>
    <!-- C2 nodes -->
    <g fill="#ffc66b">
      <circle cx="260" cy="70" r="7"/>
      <circle cx="300" cy="95" r="7"/>
      <circle cx="320" cy="55" r="7"/>
      <circle cx="280" cy="130" r="5"/>
    </g>
    <!-- C3 nodes -->
    <g fill="#6bffc9">
      <circle cx="175" cy="195" r="6"/>
      <circle cx="210" cy="210" r="6"/>
      <circle cx="200" cy="170" r="5"/>
    </g>
    <!-- Outliers -->
    <g fill="#ff6b7a">
      <circle cx="35" cy="185" r="6"/>
      <circle cx="365" cy="185" r="6"/>
    </g>
  </g>
  <text x="200" y="30" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="18" fill="#f4f6fb" font-weight="600">Synthetic Network Generators</text>
</svg>
